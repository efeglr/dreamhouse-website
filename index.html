<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> <!--loading Tailwind-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=person,search"/> <!--loading Google Icons-->
    <style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');</style> <!--loading Google Fonts-->
    <title>Dwello</title>
</head>
<body class="p-8 pr-28 pl-28">
    <nav class="flex justify-between items-center gap-x-2">
        <img src="Images/logo.svg" alt="Logo">

        <ul class="list-none flex items-center gap-x-24 font-bold text-lg">
            <li>Home</li>
            <li>Service</li>
            <li>Agents</li>
            <li>Contact</li>
        </ul>

        <div class="list-none flex gap-x-12 items-center font-bold">
            <span class="material-symbols-outlined">search</span>
            <span class="material-symbols-outlined">person</span>
            <button type="button" class="px-8 py-3 bg-gray-950 text-white rounded-md hover:bg-black-700 cursor-pointer">Sign Up</button>
        </div> 
    </nav>
    <main>
        <div class="hero pt-32 flex justify-around">
            <div class="hero-left flex flex-col justify-start gap-y-12">
                <h1 class="font-extrabold text-7xl min-w-110 leading-tight">Find Your Dream Home</h1>
                <p class="font-bold">Explore our curated selection of exquisite <br> properties meticulously tailored to your <br> unique dream home vision</p>
                <button type="button" class="px-8 py-3 bg-gray-950 text-white rounded-md hover:bg-black-700 cursor-pointer self-start">Sign Up</button>
            </div>

            <img class="hero-right -mt-10 -mr-40 w-4xl h-auto" src="/Images/hero-image.png" alt="Penthouse image">
        </div>
        
    </main>
</body>
</html>
